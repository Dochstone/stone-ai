<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=5">
<title>Stone AI — Нет соединения</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#FAF9F5;color:#1A1916;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .c{text-align:center;max-width:400px}
  .icon{width:80px;height:80px;margin:0 auto 24px;background:#D97757;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:40px}
  h1{font-size:24px;font-weight:800;margin-bottom:8px}
  p{color:#1A191680;font-size:14px;margin-bottom:24px;line-height:1.6}
  button{background:#D97757;color:#fff;border:none;padding:14px 32px;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer}
  button:active{opacity:.8}
</style>
</head>
<body>
<div class="c">
  <div class="icon">📡</div>
  <h1>Нет соединения</h1>
  <p>Проверьте интернет-подключение и попробуйте снова</p>
  <button onclick="location.reload()">Обновить</button>
</div>
</body>
</html>
