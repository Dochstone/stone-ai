<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGradI" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4a4852"/>
      <stop offset="60%" stop-color="#2c2a34"/>
      <stop offset="100%" stop-color="#1a1822"/>
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#A855F7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowI"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="100" cy="175" rx="55" ry="12" fill="#000" opacity="0.12"/>
  <path d="M45 110 Q30 85 45 60 Q55 35 80 28 Q100 22 120 28 Q145 35 155 60 Q170 85 155 110 Q148 135 130 148 Q110 158 90 155 Q65 148 50 135 Z" fill="url(#bodyGradI)" stroke="#555" stroke-width="0.5"/>
  <ellipse cx="100" cy="90" rx="35" ry="30" fill="url(#purpleGlow)" opacity="0.7"/>
  <!-- Purple cracks -->
  <g filter="url(#glowI)" opacity="0.7">
    <path d="M75 75 L85 95 L78 120" stroke="#A855F7" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M110 65 L115 90 L125 110" stroke="#C084FC" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Creative eyes (stars) -->
  <g filter="url(#glowI)">
    <circle cx="82" cy="78" r="5" fill="#C084FC"/>
    <circle cx="82" cy="78" r="2" fill="#E9D5FF"/>
    <circle cx="118" cy="78" r="5" fill="#C084FC"/>
    <circle cx="118" cy="78" r="2" fill="#E9D5FF"/>
  </g>
  <!-- Palette -->
  <g transform="translate(140 38) scale(0.7)">
    <ellipse cx="20" cy="20" rx="20" ry="16" fill="#2c2c34" stroke="#A855F7" stroke-width="1.5"/>
    <circle cx="12" cy="12" r="3.5" fill="#EF4444"/>
    <circle cx="24" cy="10" r="3.5" fill="#F59E0B"/>
    <circle cx="30" cy="20" r="3.5" fill="#10B981"/>
    <circle cx="22" cy="28" r="3.5" fill="#3B82F6"/>
    <circle cx="10" cy="24" r="3" fill="#A855F7"/>
  </g>
  <!-- Color splashes -->
  <circle cx="45" cy="50" r="3" fill="#EF4444" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="155" cy="130" r="2.5" fill="#3B82F6" opacity="0.3">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="140" r="2" fill="#10B981" opacity="0.25"/>
</svg>
