<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg3" cx="50%" cy="42%" r="50%">
      <stop offset="0%" stop-color="#606068"/>
      <stop offset="100%" stop-color="#22222a"/>
    </radialGradient>
    <radialGradient id="core3" cx="50%" cy="55%" r="20%">
      <stop offset="0%" stop-color="#FF9944" stop-opacity="1"/>
      <stop offset="50%" stop-color="#C4623D" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#C4623D" stop-opacity="0"/>
    </radialGradient>
    <filter id="f3"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="f3g"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <!-- Вариант 3: Камень с ядром — как вулканический, с ярким центром -->
  <ellipse cx="100" cy="178" rx="50" ry="10" fill="#000" opacity="0.1"/>
  <!-- Наружная оболочка -->
  <path d="M50 115 Q32 90 42 62 Q52 38 78 30 Q100 24 122 30 Q148 38 158 62 Q168 90 150 115 Q142 138 125 148 Q108 155 92 152 Q68 145 55 132 Z" fill="url(#bg3)" stroke="#444" stroke-width="0.5"/>
  <!-- Пробитая дыра в центре — видно ядро -->
  <ellipse cx="100" cy="95" rx="22" ry="18" fill="#1a1a22"/>
  <ellipse cx="100" cy="95" rx="20" ry="16" fill="url(#core3)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Свечение вокруг дыры -->
  <ellipse cx="100" cy="95" rx="28" ry="22" fill="none" stroke="#C4623D" stroke-width="1.5" opacity="0.3" filter="url(#f3g)">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2.5s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Трещины от ядра -->
  <g filter="url(#f3)" opacity="0.6">
    <path d="M80 95 L55 80" stroke="#C4623D" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M120 95 L148 82" stroke="#D4724D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M100 77 L95 50" stroke="#C4623D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M100 113 L105 140" stroke="#D4724D" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M85 105 L60 125" stroke="#C4623D" stroke-width="1" fill="none" stroke-linecap="round"/>
    <path d="M115 85 L140 65" stroke="#D4724D" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Глаза над ядром -->
  <g filter="url(#f3)">
    <circle cx="85" cy="72" r="5" fill="#FF9944"/>
    <circle cx="85" cy="72" r="2.5" fill="#FFD090"/>
    <circle cx="115" cy="72" r="5" fill="#FF9944"/>
    <circle cx="115" cy="72" r="2.5" fill="#FFD090"/>
  </g>
  <!-- Искры из ядра -->
  <circle cx="95" cy="88" r="1.5" fill="#FFaa44">
    <animate attributeName="cy" values="88;75;88" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="108" cy="92" r="1" fill="#FF8833">
    <animate attributeName="cy" values="92;80;92" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2.5s" repeatCount="indefinite"/>
  </circle>
</svg>
