<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- V5: Бело-голубой ледяной камень — кристальный, чистый, зимний -->
  <defs>
    <radialGradient id="e5" cx="45%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="40%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </radialGradient>
    <radialGradient id="e5g" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="white" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <filter id="e5f"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <ellipse cx="100" cy="178" rx="45" ry="7" fill="#0369A1" opacity="0.12"/>
  <!-- Ледяное тело -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-3;0,0" dur="4s" repeatCount="indefinite"/>
    <path d="M50 110 Q35 82 48 55 Q58 33 82 27 Q100 22 118 27 Q142 33 152 55 Q165 82 150 110 Q142 133 125 143 Q108 150 92 147 Q68 140 55 128 Z" fill="url(#e5)" stroke="#BAE6FD" stroke-width="1"/>
    <!-- Ледяные грани -->
    <path d="M70 40 L90 75 L60 100" stroke="white" stroke-width="0.5" fill="none" opacity="0.3"/>
    <path d="M130 38 L115 70 L140 95" stroke="white" stroke-width="0.5" fill="none" opacity="0.25"/>
    <path d="M90 75 L115 70" stroke="white" stroke-width="0.5" fill="none" opacity="0.2"/>
    <!-- Внутреннее свечение -->
    <ellipse cx="100" cy="85" rx="22" ry="18" fill="url(#e5g)">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Блик -->
    <ellipse cx="78" cy="50" rx="15" ry="8" fill="white" opacity="0.2" transform="rotate(-20 78 50)"/>
    <!-- Ручки — ледышки -->
    <path d="M35 100 L25 90 L30 80 L42 90 Z" fill="#7DD3FC" stroke="#BAE6FD" stroke-width="0.5"/>
    <path d="M165 97 L175 87 L170 77 L158 87 Z" fill="#7DD3FC" stroke="#BAE6FD" stroke-width="0.5"/>
    <!-- Ножки -->
    <path d="M75 145 L70 158 L85 158 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="0.5"/>
    <path d="M125 145 L115 158 L130 158 Z" fill="#0284C7" stroke="#38BDF8" stroke-width="0.5"/>
    <!-- Глаза — ярко-голубые -->
    <circle cx="82" cy="80" r="8" fill="white" opacity="0.9"/>
    <circle cx="82" cy="81" r="5" fill="#0284C7"/>
    <circle cx="84" cy="79" r="2" fill="white"/>
    <circle cx="118" cy="80" r="8" fill="white" opacity="0.9"/>
    <circle cx="118" cy="81" r="5" fill="#0284C7"/>
    <circle cx="120" cy="79" r="2" fill="white"/>
    <!-- Улыбка -->
    <path d="M90 105 Q100 113 110 105" stroke="#0369A1" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Снежинки -->
  <text x="40" y="50" font-size="10" fill="#BAE6FD" opacity="0.4">*</text>
  <text x="155" y="55" font-size="8" fill="#7DD3FC" opacity="0.3"><animate attributeName="opacity" values="0.2;0.5;0.2" dur="3s" repeatCount="indefinite"/>*</text>
  <text x="160" y="140" font-size="7" fill="#BAE6FD" opacity="0.3">*</text>
</svg>
