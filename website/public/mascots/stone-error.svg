<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGradE" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#524448"/>
      <stop offset="60%" stop-color="#342830"/>
      <stop offset="100%" stop-color="#221a20"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowE"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="100" cy="175" rx="55" ry="12" fill="#000" opacity="0.15"/>
  <path d="M45 110 Q30 85 45 60 Q55 35 80 28 Q100 22 120 28 Q145 35 155 60 Q170 85 155 110 Q148 135 130 148 Q110 158 90 155 Q65 148 50 135 Z" fill="url(#bodyGradE)" stroke="#554" stroke-width="0.5"/>
  <ellipse cx="100" cy="90" rx="35" ry="30" fill="url(#redGlow)" opacity="0.7">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Red cracks -->
  <g filter="url(#glowE)" opacity="0.7">
    <path d="M75 75 L85 95 L78 120" stroke="#EF4444" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M110 65 L115 90 L125 110 L118 130" stroke="#F87171" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M90 100 L105 105" stroke="#FCA5A5" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Sad eyes (X shaped) -->
  <g filter="url(#glowE)" opacity="0.8">
    <path d="M77 74 L87 82 M87 74 L77 82" stroke="#F87171" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <path d="M113 74 L123 82 M123 74 L113 82" stroke="#F87171" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Sad mouth -->
  <path d="M88 105 Q100 98 112 105" stroke="#F87171" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#glowE)" opacity="0.6"/>
  <!-- Broken particles falling -->
  <g opacity="0.4">
    <rect x="55" y="50" width="3" height="3" fill="#EF4444" transform="rotate(45 56 51)">
      <animate attributeName="y" values="50;170" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="140" y="60" width="2" height="2" fill="#F87171" transform="rotate(30 141 61)">
      <animate attributeName="y" values="60;170" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
