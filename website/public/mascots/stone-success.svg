<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bodyGradS" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#4a5248"/>
      <stop offset="60%" stop-color="#2c3430"/>
      <stop offset="100%" stop-color="#1a2220"/>
    </radialGradient>
    <radialGradient id="greenGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowS"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="100" cy="175" rx="55" ry="12" fill="#000" opacity="0.12"/>
  <path d="M45 110 Q30 85 45 60 Q55 35 80 28 Q100 22 120 28 Q145 35 155 60 Q170 85 155 110 Q148 135 130 148 Q110 158 90 155 Q65 148 50 135 Z" fill="url(#bodyGradS)" stroke="#4a6050" stroke-width="0.5"/>
  <ellipse cx="100" cy="90" rx="35" ry="30" fill="url(#greenGlow)" opacity="0.9"/>
  <!-- Green cracks -->
  <g filter="url(#glowS)" opacity="0.8">
    <path d="M75 75 L85 95 L78 120" stroke="#10B981" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M110 65 L115 90 L125 110 L118 130" stroke="#34D399" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M90 100 L105 105" stroke="#6EE7B7" stroke-width="1" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Happy eyes (arched) -->
  <g filter="url(#glowS)">
    <path d="M76 80 Q82 72 88 80" stroke="#6EE7B7" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M112 80 Q118 72 124 80" stroke="#6EE7B7" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Checkmark -->
  <g filter="url(#glowS)" transform="translate(135 40)">
    <circle cx="0" cy="0" r="14" fill="#10B981" opacity="0.9"/>
    <path d="M-6 0 L-2 5 L7 -5" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Sparkles -->
  <g opacity="0.7">
    <text x="45" y="45" font-size="12" fill="#10B981" opacity="0.6">✦</text>
    <text x="155" y="50" font-size="10" fill="#34D399" opacity="0.5">✦</text>
    <text x="60" y="140" font-size="8" fill="#6EE7B7" opacity="0.4">✦</text>
    <text x="140" y="140" font-size="11" fill="#10B981" opacity="0.5">✦</text>
  </g>
</svg>
