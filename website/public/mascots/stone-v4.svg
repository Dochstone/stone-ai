<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg4" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#50505a"/>
      <stop offset="100%" stop-color="#1a1a24"/>
    </radialGradient>
    <filter id="f4"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="f4g"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <!-- Вариант 4: Левитирующий камень — парит, магический, руны -->
  <!-- Тень под камнем (далеко внизу = парит) -->
  <ellipse cx="100" cy="180" rx="35" ry="6" fill="#C4623D" opacity="0.15" filter="url(#f4g)"/>
  <!-- Камень парит -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-6;0,0" dur="3s" repeatCount="indefinite"/>
    <!-- Тело -->
    <path d="M52 105 Q40 80 50 58 Q60 38 82 32 Q100 28 118 32 Q140 38 150 58 Q160 80 148 105 Q140 125 122 135 Q105 142 88 138 Q65 130 55 118 Z" fill="url(#bg4)" stroke="#555" stroke-width="0.5"/>
    <!-- Руны/символы (тонкие геометрические линии) -->
    <g stroke="#C4623D" stroke-width="1" fill="none" opacity="0.4" stroke-linecap="round">
      <path d="M70 65 L78 55 L86 65 L78 75 Z"/>
      <path d="M114 60 L122 50 L130 60 L122 70 Z"/>
      <path d="M92 105 L100 95 L108 105 L100 115 Z">
        <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
      </path>
      <circle cx="68" cy="100" r="5" opacity="0.3"/>
      <circle cx="132" cy="95" r="5" opacity="0.3"/>
    </g>
    <!-- Глаза — мудрые, полузакрытые -->
    <g filter="url(#f4)">
      <path d="M75 80 Q82 75 89 80" stroke="#F0A070" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="82" cy="79" r="2" fill="#FFD4A0"/>
      <path d="M111 80 Q118 75 125 80" stroke="#F0A070" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="118" cy="79" r="2" fill="#FFD4A0"/>
    </g>
    <!-- Свечение рун -->
    <ellipse cx="100" cy="85" rx="30" ry="25" fill="#C4623D" opacity="0.08" filter="url(#f4g)">
      <animate attributeName="opacity" values="0.05;0.15;0.05" dur="4s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <!-- Магические частицы вокруг -->
  <g>
    <circle cx="45" cy="70" r="2" fill="#C4623D" opacity="0.4">
      <animate attributeName="cy" values="70;60;70" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="155" cy="80" r="1.5" fill="#D4724D" opacity="0.3">
      <animate attributeName="cy" values="80;70;80" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="25" r="1" fill="#FFaa44" opacity="0.3">
      <animate attributeName="cy" values="25;18;25" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="140" r="1.5" fill="#C4623D" opacity="0.2">
      <animate attributeName="cy" values="140;132;140" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
