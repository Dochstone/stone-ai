<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- V4: Красно-чёрный лавовый камень — мощный, горячий -->
  <defs>
    <radialGradient id="d4" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#52525B"/>
      <stop offset="60%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </radialGradient>
    <radialGradient id="d4lava" cx="50%" cy="55%" r="25%">
      <stop offset="0%" stop-color="#FF4444" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#991B1B" stop-opacity="0"/>
    </radialGradient>
    <filter id="d4f"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <ellipse cx="100" cy="178" rx="48" ry="8" fill="#991B1B" opacity="0.15"/>
  <!-- Массивное тело -->
  <path d="M40 120 Q25 90 38 58 Q50 32 80 24 Q100 18 120 24 Q150 32 162 58 Q175 90 160 120 Q150 145 130 155 Q110 165 90 160 Q60 150 45 135 Z" fill="url(#d4)" stroke="#3F3F46" stroke-width="0.5"/>
  <!-- Лава внутри -->
  <ellipse cx="100" cy="95" rx="30" ry="25" fill="url(#d4lava)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="2s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Лавовые трещины -->
  <g filter="url(#d4f)">
    <path d="M65 50 L78 80 L68 115 L80 145" stroke="#EF4444" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7">
      <animate attributeName="opacity" values="0.5;0.8;0.5" dur="2.5s" repeatCount="indefinite"/>
    </path>
    <path d="M130 45 L122 75 L135 105 L125 135" stroke="#F87171" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    <path d="M78 80 L122 75" stroke="#DC2626" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.4"/>
  </g>
  <!-- Сильные руки -->
  <path d="M28 105 Q18 100 20 90 Q22 80 32 82 L40 100 Z" fill="#3F3F46" stroke="#52525B" stroke-width="0.5"/>
  <path d="M172 102 Q182 97 180 87 Q178 77 168 79 L160 97 Z" fill="#3F3F46" stroke="#52525B" stroke-width="0.5"/>
  <!-- Ноги -->
  <rect x="72" y="155" width="20" height="14" rx="5" fill="#27272A" stroke="#3F3F46" stroke-width="0.5"/>
  <rect x="108" y="155" width="20" height="14" rx="5" fill="#27272A" stroke="#3F3F46" stroke-width="0.5"/>
  <!-- Глаза — пылающие -->
  <g filter="url(#d4f)">
    <circle cx="80" cy="78" r="7" fill="#18181B"/>
    <circle cx="80" cy="78" r="5" fill="#EF4444"/>
    <circle cx="80" cy="77" r="2" fill="#FCA5A5"/>
    <circle cx="120" cy="78" r="7" fill="#18181B"/>
    <circle cx="120" cy="78" r="5" fill="#EF4444"/>
    <circle cx="120" cy="77" r="2" fill="#FCA5A5"/>
  </g>
  <!-- Серьёзный рот -->
  <line x1="88" y1="108" x2="112" y2="108" stroke="#EF4444" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
