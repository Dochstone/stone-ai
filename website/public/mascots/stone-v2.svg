<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg2" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#555560"/>
      <stop offset="50%" stop-color="#35353e"/>
      <stop offset="100%" stop-color="#1c1c24"/>
    </linearGradient>
    <radialGradient id="glow2" cx="45%" cy="55%" r="30%">
      <stop offset="0%" stop-color="#FF7744" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#C4623D" stop-opacity="0"/>
    </radialGradient>
    <filter id="f2"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="f2s"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <!-- Вариант 2: Угловатый булыжник — характер, грани, сила -->
  <ellipse cx="100" cy="178" rx="55" ry="10" fill="#000" opacity="0.12"/>
  <path d="M55 120 L38 80 L55 45 L90 30 L130 35 L158 55 L165 95 L150 130 L120 150 L80 148 Z" fill="url(#bg2)"/>
  <!-- Грани (тонкие линии) -->
  <path d="M55 45 L100 90 L158 55" stroke="#666" stroke-width="0.5" fill="none" opacity="0.4"/>
  <path d="M100 90 L120 150" stroke="#666" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M100 90 L55 120" stroke="#666" stroke-width="0.5" fill="none" opacity="0.3"/>
  <!-- Внутреннее свечение -->
  <ellipse cx="100" cy="90" rx="30" ry="25" fill="url(#glow2)">
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="4s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Трещины с лавой -->
  <path d="M80 55 L88 80 L78 105 L85 130" stroke="#FF6633" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#f2)" opacity="0.6">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="3s" repeatCount="indefinite"/>
  </path>
  <path d="M120 50 L115 75 L125 100" stroke="#FF8855" stroke-width="2" fill="none" stroke-linecap="round" filter="url(#f2)" opacity="0.5"/>
  <!-- Глаза — острые, решительные -->
  <g filter="url(#f2s)">
    <path d="M75 78 L90 82 L75 86" fill="#FFB060" opacity="0.9"/>
    <circle cx="82" cy="82" r="2" fill="#FFE0B0"/>
    <path d="M125 78 L110 82 L125 86" fill="#FFB060" opacity="0.9"/>
    <circle cx="118" cy="82" r="2" fill="#FFE0B0"/>
  </g>
  <!-- Блик на грани -->
  <path d="M90 32 L120 36" stroke="white" stroke-width="1" opacity="0.08" stroke-linecap="round"/>
</svg>
