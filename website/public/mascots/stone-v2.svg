<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- V2: Бирюзовый космический камень — cool, tech, neon -->
  <defs>
    <radialGradient id="b2" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="50%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#134E4A"/>
    </radialGradient>
    <filter id="b2f"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <ellipse cx="100" cy="178" rx="40" ry="6" fill="#0D9488" opacity="0.2"/>
  <!-- Тело — угловатый, tech-стиль -->
  <path d="M55 115 L40 75 L60 40 L100 30 L140 40 L160 75 L145 115 L125 145 L75 145 Z" fill="url(#b2)" stroke="#5EEAD4" stroke-width="1" opacity="0.9"/>
  <!-- Грани -->
  <path d="M60 40 L100 85 L140 40" stroke="#5EEAD4" stroke-width="0.5" fill="none" opacity="0.3"/>
  <path d="M100 85 L75 145" stroke="#5EEAD4" stroke-width="0.5" fill="none" opacity="0.2"/>
  <path d="M100 85 L125 145" stroke="#5EEAD4" stroke-width="0.5" fill="none" opacity="0.2"/>
  <!-- Неон glow -->
  <path d="M55 115 L40 75 L60 40 L100 30 L140 40 L160 75 L145 115 L125 145 L75 145 Z" fill="none" stroke="#5EEAD4" stroke-width="2" filter="url(#b2f)" opacity="0.3">
    <animate attributeName="opacity" values="0.2;0.5;0.2" dur="2s" repeatCount="indefinite"/>
  </path>
  <!-- Ручки — маленькие кристаллы -->
  <path d="M32 95 L22 85 L30 75 L42 85 Z" fill="#0D9488" stroke="#5EEAD4" stroke-width="0.5"/>
  <path d="M168 92 L178 82 L170 72 L158 82 Z" fill="#0D9488" stroke="#5EEAD4" stroke-width="0.5"/>
  <!-- Ножки -->
  <rect x="70" y="145" width="18" height="12" rx="4" fill="#134E4A" stroke="#5EEAD4" stroke-width="0.5"/>
  <rect x="112" y="145" width="18" height="12" rx="4" fill="#134E4A" stroke="#5EEAD4" stroke-width="0.5"/>
  <!-- Глаза — неоновые -->
  <circle cx="82" cy="72" r="7" fill="#042F2E"/>
  <circle cx="82" cy="72" r="5" fill="#2DD4BF" filter="url(#b2f)"/>
  <circle cx="82" cy="72" r="2" fill="white"/>
  <circle cx="118" cy="72" r="7" fill="#042F2E"/>
  <circle cx="118" cy="72" r="5" fill="#2DD4BF" filter="url(#b2f)"/>
  <circle cx="118" cy="72" r="2" fill="white"/>
  <!-- Рот — пиксельный -->
  <rect x="92" y="100" width="4" height="3" fill="#5EEAD4" rx="1"/>
  <rect x="98" y="103" width="4" height="3" fill="#5EEAD4" rx="1"/>
  <rect x="104" y="100" width="4" height="3" fill="#5EEAD4" rx="1"/>
