<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- V1: Тёплый янтарный камень — как солнечный мёд -->
  <defs>
    <radialGradient id="a1" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="40%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <radialGradient id="a1g" cx="50%" cy="50%" r="30%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <filter id="a1f"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <ellipse cx="100" cy="175" rx="45" ry="8" fill="#92400E" opacity="0.2"/>
  <!-- Тело — гладкий янтарь -->
  <ellipse cx="100" cy="98" rx="60" ry="55" fill="url(#a1)"/>
  <ellipse cx="85" cy="70" rx="25" ry="15" fill="white" opacity="0.12" transform="rotate(-20 85 70)"/>
  <!-- Тёплое ядро -->
  <ellipse cx="100" cy="95" rx="25" ry="20" fill="url(#a1g)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite"/>
  </ellipse>
  <!-- Ручки -->
  <ellipse cx="38" cy="108" rx="14" ry="10" fill="#B45309" transform="rotate(-20 38 108)"/>
  <ellipse cx="162" cy="105" rx="14" ry="10" fill="#B45309" transform="rotate(20 162 105)"/>
  <!-- Ножки -->
  <ellipse cx="78" cy="152" rx="12" ry="8" fill="#92400E"/>
  <ellipse cx="122" cy="152" rx="12" ry="8" fill="#92400E"/>
  <!-- Большие глаза -->
  <circle cx="82" cy="85" r="10" fill="white"/>
  <circle cx="82" cy="87" r="6" fill="#1C1917"/>
  <circle cx="84" cy="85" r="2.5" fill="white"/>
  <circle cx="118" cy="85" r="10" fill="white"/>
  <circle cx="118" cy="87" r="6" fill="#1C1917"/>
  <circle cx="120" cy="85" r="2.5" fill="white"/>
  <!-- Улыбка -->
  <path d="M88 108 Q100 118 112 108" stroke="#78350F" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Щёчки -->
  <circle cx="70" cy="100" r="6" fill="#FDE68A" opacity="0.3"/>
  <circle cx="130" cy="100" r="6" fill="#FDE68A" opacity="0.3"/>
</svg>
