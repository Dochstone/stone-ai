server {
    listen 80;
    server_name stoneai.ru www.stoneai.ru;
    return 301 https://stoneai.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stoneai.ru;

    ssl_certificate /etc/letsencrypt/live/stoneai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoneai.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Static assets — direct from disk, bypass Node.js
    location /_next/static/ {
        alias /var/www/stone-ai/website/.next/standalone/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /public/ {
        alias /var/www/stone-ai/website/.next/standalone/public/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon, manifest, icons, robots, sitemap
    location ~* ^/(favicon\.ico|manifest\.json|icon-.*\.png|og-image\.png|robots\.txt|sitemap\.xml)$ {
        root /var/www/stone-ai/website/.next/standalone/public;
        expires 1d;
        access_log off;
    }

    # Demo assets (images, videos, audio, 3D models)
    location /demo/ {
        root /var/www/stone-ai/website/.next/standalone/public;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Reverse proxy to Next.js
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
