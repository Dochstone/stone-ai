# Fix 1: www -> non-www redirect for HTTPS
server {
    listen 443 ssl http2;
    server_name www.stoneai.ru;
    ssl_certificate /etc/letsencrypt/live/stoneai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoneai.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://stoneai.ru$request_uri;
}

server {
    server_name stoneai.ru;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    location = /google9d0f67b173b5df37.html { root /var/www/stone-ai/website/public; }
    location = /yandex_accfbdafe453c74f.html { root /var/www/stone-ai/website/public; }

    location /_next/static/ {
        alias /var/www/stone-ai/website/.next/static/;
        access_log off;
        try_files $uri =404;
        error_page 404 = @chunk_missing;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Missing chunk during deploy: tell CDN NOT to cache this 404,
    # so when the file is back (build finishes) clients get it immediately.
    location @chunk_missing {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Cloudflare-CDN-Cache-Control "no-store" always;
        return 404;
    }

    location /mascots/ { root /var/www/stone-ai/website/public; expires 1y; access_log off; }
    location /demo/ { root /var/www/stone-ai/website/public; expires 1y; access_log off; }
    location /logos/ { root /var/www/stone-ai/website/public; expires 1y; access_log off; }

    location = /sw.js { root /var/www/stone-ai/website/public; add_header Cache-Control "no-cache"; }
    location = /manifest.json { root /var/www/stone-ai/website/public; add_header Cache-Control "public, max-age=86400"; }
    location = /tonconnect-manifest.json { root /var/www/stone-ai/website/public; add_header Cache-Control "public, max-age=3600"; default_type application/json; }
    location = /llms.txt { root /var/www/stone-ai/website/public; }
    location = /llms-full.txt { root /var/www/stone-ai/website/public; }
    location = /stoneai2026indexnow.txt { alias /var/www/stone-ai/website/public/stoneai2026indexnow.txt; default_type text/plain; }

    # Media files (images, videos) — MUST be before the regex catch-all
    location ^~ /media/ {
        alias /var/www/stone-ai/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Avatars
    location ^~ /uploads/avatars/ {
        alias /var/www/stone-ai/backend/uploads/avatars/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Static images from website/public (catch-all for non-media images)
    location ~* \.(jpg|jpeg|png|gif|webp|svg|ico)$ {
        root /var/www/stone-ai/website/public;
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # API -> backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        client_max_body_size 20M;
    }

    # Telegram webhook
    location /webhook/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Frontend
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/stoneai.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stoneai.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    if ($host = www.stoneai.ru) { return 301 https://stoneai.ru$request_uri; }
    if ($host = stoneai.ru) { return 301 https://$host$request_uri; }
    listen 80;
    server_name stoneai.ru www.stoneai.ru;
    return 404;
}
